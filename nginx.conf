# Конфигурация Nginx для сервера (разместить в /etc/nginx/sites-available/gluco.example.com)

# 1. HTTP — Редирект на HTTPS и проверка Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name gluco.example.com;

    # Для certbot проверки
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS — Проксирование на приложение (порт 4999)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gluco.example.com;

    # Современный синтаксис HTTP/2 (Nginx 1.25+)
    http2 on;

    # Пути к сертификатам Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/gluco.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gluco.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4999;
        proxy_http_version 1.1;

        # WebSocket и передача реального IP клиента
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
